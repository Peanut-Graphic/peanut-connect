    id: 'priorities',
    section: 'Operational',
    title: 'Immediate technical priorities (multi-select — pick all that apply)',
    context: "From CAT's report. These are independent of the strategic answers above. Pick what gets worked on in the next 2-4 weeks.",
    multi: true,
    options: [
      {
        value: 'split-api',
        title: 'Split the 2,819-line class-connect-api.php',
        desc: 'Along the existing seam: health/updates/backup vs marketing/tracking/analytics-proxy.',
        meaning: 'Refactor work, ~3-5 days. Reduces blast radius of every future change to that file.',
        pros: ['Easier to reason about.', 'Future security audits scope shrinks.', 'New endpoints get added without touching unrelated code.'],
        cons: ['Pure refactor — no user-visible value.', 'Risk of introducing bugs during the split.', "Doesn't ship customer features."],
      },
      {
        value: 'envelope',
        title: 'Harden Connect↔Hub transport (signed envelope)',
        desc: 'Same as Q4 option B. ~2 weeks of focused work.',
        meaning: 'Permanent fix to the WAF/response-shape bug class. Real protocol-level engineering.',
        pros: ['Ends the WAF whack-a-mole.', 'Better security posture.', 'Less debugging time forever after.'],
        cons: ['Two-week timeline.', 'Both ends ship in lockstep.', 'Existing clients need a transition period.'],
      },
      {
        value: 'cleanup-repo',
        title: 'Strip composer artifacts and dist/ZIPs from repo',
        desc: 'composer.phar, composer-setup.php, 14 release ZIPs in dist/ — all should not be tracked.',
        meaning: 'Cleanup work, ~1 hour. Smaller checkout, cleaner repo, no accidental reuse of stale binaries.',
        pros: ['Trivial to do.', "Removes confusion ('which is the real composer.phar?')", 'Keeps repo lean.'],
        cons: ['No real downside.', 'Worth checking that no script depends on the in-repo composer.phar first.'],
      },
      {
        value: 'security-audit',
        title: 'Real security audit on class-connect-api.php',
        desc: '2,819-line API surface deserves a focused review pass before more endpoints get added.',
        meaning: 'Dedicated review — auth checks, input sanitization, rate limiting, capability checks, SQL queries. ~2-3 days.',
        pros: ['Catches issues before next release.', 'Documents the threat model for future work.', 'Establishes a baseline for the post-split refactor.'],
        cons: ['Time investment.', 'May surface uncomfortable findings that block other work.'],
      },
      {
        value: 'release-310',
        title: 'Build SPA + ship 3.7.10 with rebrand',
        desc: 'npm run build, version bump, GitHub release, mu-plugin sees the new name.',
        meaning: 'The rebrand is in source but customers still see "Hub Connect" in the SPA bundle. This makes it real.',
        pros: ['Closes the loop on the rebrand work.', 'Existing installs see the new name on next auto-update.', 'Trivial release.'],
        cons: ['You may want to bundle other fixes with the release first.'],
      },
      {
        value: 'axios-fix',
        title: 'Fix the axios interceptor double-unwrap class of bug',
        desc: 'Two bugs in 24 hours (3.7.2, 3.7.3) suggest the interceptor does magic call sites don\'t expect.',
        meaning: 'Audit the axios layer — formalize the response shape, remove implicit unwrapping, type the contracts. ~2 days.',
        pros: ['Eliminates a recurring bug class.', "Makes API contracts explicit and testable.", 'Adjacent to the envelope work.'],
        cons: ['Touches every API call site to verify nothing breaks.', 'Pure cleanup, no new features.'],
      },
      {
        value: 'other',
        title: 'Other — write it in the notes',
        desc: 'Capture priorities not on this list.',
        meaning: 'Use the notes field on the next screen to describe what else needs to ship.',
        pros: [],
        cons: [],
      },
    ],
  },
];

const state = {
  index: 0,
  phase: 'pick', // 'pick' | 'challenge' | 'done'
  answers: {}, // id -> string | string[]
  notes: {}, // id -> string
};

const root = document.getElementById('root');
const progress = document.getElementById('progress');

function renderProgress() {
  progress.innerHTML = QUESTIONS.map((_, i) => {
    let cls = '';
    if (i < state.index) cls = 'done';
    else if (i === state.index) cls = 'current';
    return `<div class="pip ${cls}"></div>`;
  }).join('');
}

function isAnswered(q) {
  const a = state.answers[q.id];
  if (q.multi) return Array.isArray(a) && a.length > 0;
  return typeof a === 'string' && a.length > 0;
}

function renderPick(q) {
  const isMulti = !!q.multi;
  const inputType = isMulti ? 'checkbox' : 'radio';
  const current = state.answers[q.id];

  const optionsHTML = q.options.map(o => {
    const checked = isMulti
      ? Array.isArray(current) && current.includes(o.value)
      : current === o.value;
    return `
      <label class="option ${checked ? 'selected' : ''}" data-val="${o.value}">
        <input type="${inputType}" name="opt" value="${o.value}" ${checked ? 'checked' : ''} />
        <div class="option-body">
          <div class="option-title">${escapeHtml(o.title)}</div>
          <div class="option-desc">${escapeHtml(o.desc)}</div>
        </div>
      </label>
    `;
  }).join('');

  root.innerHTML = `
    <div class="card">
      <div class="section-tag">${escapeHtml(q.section)} · question ${state.index + 1} of ${QUESTIONS.length}${isMulti ? ' · multi-select' : ''}</div>
      <h2 class="q-title">${escapeHtml(q.title)}</h2>
      <p class="q-context">${escapeHtml(q.context)}</p>
      <div class="options" id="opts">${optionsHTML}</div>
      <div class="actions">
        ${state.index > 0 ? '<button class="ghost" id="back">Back</button>' : ''}
        <button class="primary" id="next" ${isAnswered(q) ? '' : 'disabled'}>Next →</button>
      </div>
    </div>
  `;

  document.getElementById('opts').addEventListener('click', e => {
    const lbl = e.target.closest('.option');
    if (!lbl) return;
    const val = lbl.dataset.val;
    if (isMulti) {
      const arr = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
      const i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
      state.answers[q.id] = arr;
    } else {
      state.answers[q.id] = val;
    }
    renderPick(q);
  });

  const nextBtn = document.getElementById('next');
  if (nextBtn) nextBtn.addEventListener('click', () => {
    if (!isAnswered(q)) return;
    state.phase = 'challenge';
    render();
  });

  const backBtn = document.getElementById('back');
  if (backBtn) backBtn.addEventListener('click', () => {
    state.index = Math.max(0, state.index - 1);
    state.phase = 'pick';
    render();
  });
}

function renderChallenge(q) {
  const a = state.answers[q.id];
  const picks = q.multi ? a.map(v => q.options.find(o => o.value === v)).filter(Boolean) : [q.options.find(o => o.value === a)];

  let body = '';
  if (q.multi) {
    body = `
      <div class="picked-list">
        ${picks.map(p => `
          <div class="pick">
            <div class="pick-title">${escapeHtml(p.title)}</div>
            <div class="pick-meaning">${escapeHtml(p.meaning || p.desc)}</div>
          </div>
        `).join('')}
      </div>
      <div class="counter">You picked ${picks.length} item${picks.length === 1 ? '' : 's'}. Anything you put on this list eats time you could spend on the strategic shifts above. Are these the highest-leverage moves, or the most comfortable ones?</div>
    `;
  } else {
    const p = picks[0];
    body = `
      <div class="meaning">${escapeHtml(p.meaning)}</div>
      <h4>Pros</h4>
      <ul class="pros">${p.pros.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
      <h4>Cons</h4>
      <ul class="cons">${p.cons.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
      <div class="counter">${escapeHtml(p.challenge)}</div>
    `;
  }

  root.innerHTML = `
    <div class="card">
      <div class="section-tag">${escapeHtml(q.section)} · CAT pushes back</div>
      <h2 class="q-title">${escapeHtml(q.title)}</h2>
      <div class="challenge">${body}</div>
      <textarea id="notes" placeholder="Any nuance, constraints, or pushback to your own answer? (optional, will go in the final summary)">${escapeHtml(state.notes[q.id] || '')}</textarea>
      <div class="actions">
        <button class="ghost" id="change">← Change my answer</button>
        <button class="primary" id="stick">Stand by it →</button>
      </div>
    </div>
  `;

  document.getElementById('notes').addEventListener('input', e => {
    state.notes[q.id] = e.target.value;
  });

  document.getElementById('change').addEventListener('click', () => {
    state.phase = 'pick';
    render();
  });

  document.getElementById('stick').addEventListener('click', () => {
    if (state.index === QUESTIONS.length - 1) {
      state.phase = 'done';
    } else {
      state.index += 1;
      state.phase = 'pick';
    }
    render();
  });
}

function detectConflicts() {
  const c = [];
  const a = state.answers;

  if (a.identity === 'satellite' && a.suite === 'deprecate') {
    c.push("Q1 says End to End is a satellite of Hub, but Q3 says deprecate Suite. If End to End is just Hub's limb, what's the standalone product Suite users migrate to? Reconcile.");
  }
  if (a.identity === 'satellite' && a.surface === 'edge') {
    c.push("Q1 says satellite (Hub is the brain) but Q5 says move more to the edge. A satellite that grows on its own is a contradiction — pick whether the plugin is gaining or shedding capability.");
  }
  if (a.identity === 'os' && a.surface === 'hub') {
    c.push("Q1 says standalone marketing OS, Q5 says move more to Hub. Standalone means LESS Hub dependency, not more. These don't both fit.");
  }
  if (a.identity === 'os' && a.suite === 'split') {
    c.push("Q1 says End to End is the standalone product, Q3 says Suite is the standalone-ish dashboard. Two standalone products from one ecosystem competing for attention — is that intentional?");
  }
  if (a.buyer === 'end-client' && a.identity === 'satellite') {
    c.push("Q2 says single-site end-clients are the buyer, but Q1 says End to End requires a Hub. Single-site owners don't have Hubs. The buyer profile and the product framing aren't compatible.");
  }
  if (a.buyer === 'agency' && a.identity === 'os') {
    c.push("Q2 says agencies are the buyer (multi-site, current tier model), but Q1 commits to a standalone OS. Agencies don't need standalone — they need multi-site management. Is the standalone OS a different product?");
  }
  if (a.suite === 'defer' && (a.identity === 'absorb' || a.identity === 'os' || a.identity === 'campaign-pure')) {
    // identity values are different — keep this loose
  }
  if (a.suite === 'defer' && a.identity && a.identity !== 'trenchcoat') {
    c.push("Q3 defers the Suite question, but Q1 makes a strong identity commitment that depends on Suite's status. You can't decide what End to End IS without deciding what Suite is doing.");
  }
  if (a.waf === 'triage' && (a.surface === 'hub' || a.surface === 'edge')) {
    c.push("Q4 picks per-client WAF triage only, but Q5 commits to ANY architectural shift in marketing surface. Architectural shifts increase Connect↔Hub traffic — meaning more WAF incidents. Triage-only won't survive that.");
  }
  if (a.waf === 'subdomain' && a.surface === 'hub') {
    c.push("Q4 hopes a subdomain change fixes the WAF, Q5 commits to MORE Hub-bound traffic. If the subdomain doesn't work (most likely), centralizing on Hub gets very painful.");
  }
  if (Array.isArray(a.priorities)) {
    if (a.priorities.includes('envelope') && a.waf === 'triage') {
      c.push("Q4 says triage-only, but Q6 includes building the envelope protocol. Pick one — either the envelope is worth it or it isn't.");
    }
    if (!a.priorities.includes('envelope') && a.waf === 'envelope') {
      c.push("Q4 commits to the envelope protocol but Q6 didn't pick it as a priority. Either it's a priority or you're saying it's not getting done.");
    }
    if (!a.priorities.includes('envelope') && a.waf === 'both') {
      c.push("Q4 says triage now + envelope medium-term, but Q6 didn't include the envelope work. Without scheduling it as a priority, 'medium-term' becomes 'never.'");
    }
    if (a.priorities.includes('split-api') && a.priorities.includes('security-audit')) {
      c.push("Q6 includes BOTH split-api and security-audit. Order matters: audit before split (audit informs split design) or after (audit covers split output)? Decide which.");
    }
  }
  return c;
}

function renderDone() {
  const conflicts = detectConflicts();
  const md = generateMarkdown();

  let conflictsHTML = '';
  if (conflicts.length > 0) {
    conflictsHTML = `
      <div class="conflicts">
        <h3>⚠ Tensions to reconcile</h3>
        <ul>${conflicts.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="card">
      <div class="section-tag">Final · paste back to Claude</div>
      <h2 class="q-title">All decisions captured</h2>
      ${conflictsHTML}
      ${renderSummary()}
      <hr/>
      <h3 style="margin: 0 0 8px;">Markdown for Claude <button class="ghost copybtn" id="copy">Copy</button></h3>
      <pre id="md">${escapeHtml(md)}</pre>
      <div class="actions">
        <button class="ghost" id="restart">Start over</button>
      </div>
    </div>
  `;

  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(md);
      const btn = document.getElementById('copy');
      btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    } catch (e) {
      alert('Copy failed — select the text manually.');
    }
  });

  document.getElementById('restart').addEventListener('click', () => {
    if (!confirm('Wipe all answers and start over?')) return;
    state.index = 0;
    state.phase = 'pick';
    state.answers = {};
    state.notes = {};
    render();
  });
}

function renderSummary() {
  return QUESTIONS.map(q => {
    const a = state.answers[q.id];
    if (!a || (Array.isArray(a) && a.length === 0)) return '';
    const opts = q.multi ? a.map(v => q.options.find(o => o.value === v)).filter(Boolean) : [q.options.find(o => o.value === a)];
    const note = state.notes[q.id];
    return `
      <div class="summary-section">
        <h3>${escapeHtml(q.title)}</h3>
        <div class="picked-list">
          ${opts.map(o => `
            <div class="pick">
              <div class="pick-title">${escapeHtml(o.title)}</div>
              <div class="pick-meaning">${escapeHtml(o.meaning || o.desc)}</div>
            </div>
          `).join('')}
          ${note ? `<div class="pick"><div class="small">Notes: ${escapeHtml(note)}</div></div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function generateMarkdown() {
  const lines = ['# CAT decision tree — Peanut End to End', '', `_Captured ${new Date().toISOString().slice(0, 10)}_`, ''];
  QUESTIONS.forEach(q => {
    const a = state.answers[q.id];
    if (!a || (Array.isArray(a) && a.length === 0)) return;
    lines.push(`## ${q.title}`);
    lines.push('');
    const opts = q.multi ? a.map(v => q.options.find(o => o.value === v)).filter(Boolean) : [q.options.find(o => o.value === a)];
    opts.forEach(o => {
      lines.push(`- **${o.title}** — ${o.meaning || o.desc}`);
    });
    if (state.notes[q.id]) {
      lines.push('');
      lines.push(`> Notes: ${state.notes[q.id]}`);
    }
    lines.push('');
  });

  const conflicts = detectConflicts();
  if (conflicts.length > 0) {
    lines.push('## ⚠ Tensions to reconcile');
    lines.push('');
    conflicts.forEach(c => lines.push(`- ${c}`));
    lines.push('');
  }

  lines.push('---');
  lines.push('');
  lines.push('Use these answers to draft an action plan. Surface any tensions above before committing to next steps.');
  return lines.join('\n');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  renderProgress();
  if (state.phase === 'done') return renderDone();
  const q = QUESTIONS[state.index];
  if (state.phase === 'challenge') return renderChallenge(q);
  return renderPick(q);
}

render();
</script>
</body>
</html>
