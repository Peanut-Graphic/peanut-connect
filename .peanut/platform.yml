schema_version: 1
project:
  id: peanut-connect
  name: Peanut Connect / Peanut End to End
  classification: distributed-plugin
  repository: https://github.com/Peanut-Graphic/peanut-connect.git
  lifecycle: active
ownership:
  platform: Peanut Graphic
  deployment: Peanut Graphic
  rollback: Peanut Graphic
environments:
  - name: distribution
    kind: production
    provider: GitHub Releases and Peanut License Server
    url: "https://github.com/Peanut-Graphic/peanut-connect/releases"
  - name: central-first-party-install
    kind: production
    provider: peanutgraphic.com shared WordPress hosting
    url: "https://peanutgraphic.com"
runtimes:
  - name: php
    baseline: WordPress compatibility matrix
    declarations:
      - { scope: dependency, source: peanut-connect.php, value: "Requires PHP 8.0" }
      - { scope: dependency, source: composer.json, value: "require >=8.0; platform 8.0.0" }
      - { scope: ci, source: .github/workflows/tests.yml, value: "required PHP 8.0 minimum unit/property lane, PHP 8.2 coverage lane, and PHP 8.3 dependency/security lane" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "PHP 8.3" }
    production_observation: { status: verified, value: "PHP 8.5.9 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only host interpreter and active-plugin inventory" }
  - name: node
    baseline: "22"
    declarations:
      - { scope: dependency, source: package.json, value: "engines and packageManager missing; stale package version 2.1.2" }
      - { scope: dependency, source: frontend/package.json, value: "engines and packageManager missing; stale package version 3.9.3" }
      - { scope: ci, source: .github/workflows/tests.yml, value: "Node 20" }
      - { scope: ci, source: .github/workflows/accessibility.yml, value: "Node 20" }
    production_observation: { status: not-applicable }
  - name: wordpress
    baseline: WordPress 6.0+
    declarations:
      - { scope: dependency, source: peanut-connect.php, value: "Requires at least 6.0" }
      - { scope: dependency, source: readme.txt, value: "Requires 6.0; tested up to 6.4" }
      - { scope: test, source: .github/workflows/wp-contract.yml, value: "WordPress latest" }
    production_observation: { status: verified, value: "WordPress 6.9.7 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only WP-CLI core-version and active-plugin inventory" }
databases:
  - name: host-database
    role: transactional
    baseline: Host MySQL or MariaDB compatibility
    declarations:
      - { scope: dependency, source: includes/class-connect-database.php, value: "WordPress dbDelta tables and DB version migrations on plugins_loaded" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "mysql:8 real WordPress REST contract lane" }
    production_equivalent_test: "yes"
    production_observation: { status: verified, value: "MariaDB 10.6.27, latin1_swedish_ci server collation, SQL mode ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only database metadata query; no application rows read" }
services: []
distribution:
  mode: signed-github-release
  source_of_truth: Peanut Meta scripts/publish-plugin.sh
  versioned_artifact: "yes"
  signed: "yes"
  canary: "yes"
  rollback: unknown
exceptions:
  - id: PAR-207
    concern: The distributed PHP minimum is enforced, but Node declarations remain below the fleet baseline and JavaScript tools are not pinned
    reason: The plugin and Composer deliberately permit PHP 8.0 and required CI now installs the lockfile and runs the unit/property suite on PHP 8.0, alongside PHP 8.2 coverage and PHP 8.3 dependency/security lanes. The central first-party installation runs PHP 8.5.9, JavaScript CI uses Node 20, and neither package.json declares engines.node or packageManager.
    risk: The declared PHP minimum is protected from regression, but JavaScript local builds, CI, and release assets can still exercise materially different runtimes and package-manager behavior.
    owner: Peanut Graphic
    verification: Keep the PHP 8.0 declaration contract and required minimum lane green, then pin the fleet Node and npm versions for every JavaScript build.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-306
    concern: Distributed host databases include MariaDB but CI exercises only MySQL 8
    reason: WordPress hosts control the database engine. The central first-party installation runs MariaDB 10.6.27 with latin1_swedish_ci and a non-strict SQL mode, while the only real WordPress contract lane uses mysql:8, the plugin runs dbDelta-backed schema changes during normal plugin loading, and distributed client hosts remain unverified.
    risk: MariaDB-specific DDL, index, collation, or migration behavior can fail on client sites without appearing in the required gate.
    owner: Peanut Graphic
    verification: Run the reusable real-WordPress contract and migration tests against every supported MySQL and MariaDB lane.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-404
    concern: Repository-local release and package scripts bypass the canonical signed publisher
    reason: scripts/release.sh directly pushes main and creates an unsigned GitHub Release, while scripts/package.sh creates a ZIP without the Ed25519 manifest, license-server advertisement, or active canary assertions enforced by Peanut Meta.
    risk: An operator can publish a plausible official release that clients cannot authenticate and that bypasses the proven release and canary contract.
    owner: Peanut Graphic
    verification: Replace local outward-facing release behavior with a dry-run wrapper around Peanut Meta or retire it after the canonical path is documented and tested.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-405
    concern: Release metadata, package completeness, and rollback evidence drift
    reason: The plugin reports 3.36.0 while root and frontend package metadata report 2.1.2 and 3.9.3. The live update endpoint advertises 3.36.0 but returns Peanut Suite description, installation, and changelog text. The signed 3.36.0 ZIP includes vendor and runtime assets but omits the tracked uninstall.php cleanup entrypoint, and the publisher has no rollback assertion.
    risk: Operators and clients can receive misleading release metadata, uninstall may leave stored data behind, and an update incident has no source-verifiable rollback control.
    owner: Peanut Graphic
    verification: Establish one version/metadata source, assert required package contents including the uninstall contract, correct license-server product metadata, and add a tested rollback check to the canonical publisher.
    review_date: "2026-11-14"
    status: proposed
verification:
  status: live-verified
  audited_commit: 50054a02e4174da111c638793c390c6415d21b18
  last_reviewed: "2026-08-15"
  sources:
    - peanut-connect.php
    - readme.txt
    - README.md
    - composer.json
    - package.json
    - frontend/package.json
    - includes/class-connect-database.php
    - includes/class-connect-self-updater.php
    - scripts/release.sh
    - scripts/package.sh
    - scripts/bump-version.sh
    - .github/workflows/tests.yml
    - .github/workflows/accessibility.yml
    - .github/workflows/wp-contract.yml
    - Peanut-Graphic/peanut-meta:scripts/publish-plugin.sh
    - Peanut-Graphic/peanut-meta:scripts/verify-plugin-release.sh
    - GitHub Release v3.36.0 assets and signed manifest
    - Peanut License Server /updates/check response for peanut-connect
    - Read-only central first-party PHP, WordPress, active-plugin, MariaDB version, collation, and SQL-mode metadata on 2026-08-15
  outstanding:
    - Inventory supported distributed client-host PHP, WordPress, database version, collation, and SQL-mode compatibility without collecting customer data.
    - Align and pin PHP, Node, and npm declarations under PAR-207 and PAR-205.
    - Add supported MariaDB real-WordPress contract lanes under PAR-306.
    - Retire or wrap the unsigned local release path under PAR-404.
    - Reconcile versions, package completeness, product metadata, and rollback under PAR-405.
