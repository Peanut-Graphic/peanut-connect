<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dino</title>
<style>
  /* ---------------------------------------------------------------
     A thing to look at, not a thing to operate.

     The creature is the picture and the words are a caption. Nothing
     moves quickly and nothing changes position between states — what
     changes is colour and posture, which the corner of your eye can
     read without you turning your head.

     Colour belongs to the *project*, not the agent. That is what makes
     it worth anything: green means the same repo today as last week.
     --------------------------------------------------------------- */
  :root {
    --bg: #0b0f0d;
    --panel: #101512;
    --line: #1f2a24;
    --line-soft: #18211c;
    --text: #dfe9e3;
    --muted: #7c8b83;
    --faint: #4a574f;

    /* The dino never changes colour: it is the one fixed thing on screen. */
    --dino: #4d9e68;
    --dino-ink: #080c0a;

    /* Set from the focused task's project colour. */
    --accent: #4ade80;
    --accent-deep: #2f7a4d;
    --accent-dark: #24503a;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    /* A monospace stack rather than a pixel webfont: this is a local tool and
       it should look right offline, with no outbound request for a typeface. */
    font: 14px/1.6 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 40px;
  }

  .stage { width: 100%; max-width: 540px; margin: auto 0; }

  /* --- toolbar ------------------------------------------------------- */

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0 12px;
    background: linear-gradient(var(--bg) 72%, transparent);
  }

  .tabs { display: flex; gap: 2px; }

  .tab {
    border: 0;
    background: transparent;
    color: var(--faint);
    font: inherit;
    font-size: 13px;
    padding: 6px 11px;
    border-radius: 0;
    cursor: pointer;
  }
  .tab:hover { color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); }
  .tab .count { color: var(--faint); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] .count { color: var(--muted); }
  /* Only the queue that wants you earns a coloured count. */
  .tab[data-tab="review"] .count[data-any="true"] { color: var(--accent); }

  .toolbar-right { display: flex; align-items: center; gap: 10px; }

  .ghost {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 0;
    cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: var(--line); background: var(--panel); }

  .link { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: transparent; }
  .link[data-live="false"] { color: #f5b942; }

  /* --- the scene -----------------------------------------------------
     A constant dino on a floor, and the work stacking up beside it.

     The creature never changes colour — it is the one fixed thing on
     screen. Colour belongs to the tasks, because colour means project.
     The dino's job is to react: it watches work drop in, looks at you
     when something wants you, and gets bored when nothing is happening.
     -------------------------------------------------------------------- */

  .scene {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 0;
    /* Scanlines. Two device pixels so they survive a retina screen instead of
       blurring into a flat wash. */
    background-image: repeating-linear-gradient(
      to bottom, rgba(0,0,0,.34) 0 2px, transparent 2px 4px);
    border: 1px solid var(--line);
    overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #121a16 0%, var(--bg) 70%);
    transition: border-color 1.2s ease, background 1.2s ease;
  }
  .scene[data-mood="alert"] { border-color: var(--accent-deep); }

  .horizon {
    position: absolute;
    left: 8%; right: 8%; bottom: 26%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 22%, var(--line) 78%, transparent);
  }

  /* --- the dinosaur, currently a box ----------------------------------

     SWAP POINT. Replace `.dino` with the sprite. Two attributes drive
     everything: `data-mood` (bored / watching / alert / pleased) and
     `data-look` (stack / you / away). A sprite honouring those inherits
     the whole performance.
     ---------------------------------------------------------------------- */

  .dino-anchor { position: absolute; left: 68%; bottom: 26%; transform: translateX(-50%); }

  /**
   * The dinosaur, currently a rounded square with eyes.
   *
   * SWAP POINT. Everything hangs off two attributes: `data-mood`
   * (bored / watching / alert / pleased) and `data-look` (stack / you / away).
   * A sprite honouring those inherits the whole performance.
   *
   * It is the one thing on screen that never changes colour — colour belongs
   * to the projects, and the creature is the constant.
   */
  .dino {
    width: 108px; height: 108px;
    border-radius: 26px;
    background: var(--dino);
    position: relative;
    box-shadow: 4px 4px 0 rgba(0, 0, 0, .5);
    transition: background 1s ease, box-shadow .6s ease, transform .6s ease;
  }

  .dino::before,
  .dino::after {
    content: "";
    position: absolute;
    top: 42px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--dino-ink);
    transition: transform .55s cubic-bezier(.22,1,.36,1), height .14s ease, top .14s ease;
  }
  .dino::before { left: 28px; }
  .dino::after  { right: 28px; }

  /* Looking. The work stacks to its left, so watching it means eyes left;
     something that wants you means eyes front. */
  .dino[data-look="stack"]::before,
  .dino[data-look="stack"]::after { transform: translateX(-4px); }
  .dino[data-look="you"]::before,
  .dino[data-look="you"]::after   { transform: translateX(0); }

  /* Bored: half-lidded, and the gaze wanders on a long slow loop. */
  .dino[data-mood="bored"] { opacity: .58; animation: doze 6s ease-in-out infinite; }
  .dino[data-mood="bored"]::before,
  .dino[data-mood="bored"]::after {
    height: 3px; top: 47px; border-radius: 2px;
    animation: wander 13s ease-in-out infinite;
  }
  @keyframes doze {
    0%, 100% { transform: translateY(0)   scaleY(1);    }
    50%      { transform: translateY(2px) scaleY(.985); }
  }
  @keyframes wander {
    0%, 30%   { transform: translateX(0);    }
    40%, 55%  { transform: translateX(-5px); }
    65%, 80%  { transform: translateX(4px);  }
    90%, 100% { transform: translateX(0);    }
  }

  /* Watching work happen: a slow breath, so "still going" needs no spinner. */
  .dino[data-mood="watching"] { animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0)    scale(1);    }
    50%      { transform: translateY(-6px) scale(1.02); }
  }

  /* Something wants you: upright, eyes front, lit in the colour of whatever
     is asking. It holds still on purpose — a thing that jiggles at you all
     day is a thing you end up resenting. */
  .dino[data-mood="alert"] {
    transform: translateY(-4px);
    animation: alert 4.5s ease-in-out infinite;
  }
  @keyframes alert {
    0%, 100% { box-shadow: 4px 4px 0 rgba(0,0,0,.5), 0 0 38px -10px var(--accent); }
    50%      { box-shadow: 4px 4px 0 rgba(0,0,0,.5), 0 0 52px -4px  var(--accent); }
  }

  /* Just ate, or you just decided something. A short, pleased bob. */
  .dino[data-mood="pleased"] { animation: pleased .85s ease-out; }
  @keyframes pleased {
    0%   { transform: translateY(0)     scaleX(1);    }
    28%  { transform: translateY(-11px) scaleX(.93);  }
    58%  { transform: translateY(0)     scaleX(1.08); }
    100% { transform: translateY(0)     scaleX(1);    }
  }

  /* Sleeping. Three z's drifting up and to the right of his head, each
     fading out as it rises. Only while he is bored — a dozing creature is
     the one state that benefits from a little motion, because otherwise
     "asleep" and "switched off" look identical. */
  .zzz {
    position: absolute;
    left: 100%; top: 2px;
    width: 0; height: 0;
    pointer-events: none;
    display: none;
  }
  .dino[data-mood="bored"] ~ .zzz { display: block; }

  .z {
    position: absolute;
    left: 0; top: 0;
    font-size: 13px;
    line-height: 1;
    color: var(--dino);
    opacity: 0;
    animation: drift 4.2s ease-out infinite;
  }
  /* Staggered so there is always one in the air, never a gap or a clump. */
  .z:nth-child(2) { animation-delay: 1.4s; }
  .z:nth-child(3) { animation-delay: 2.8s; }

  @keyframes drift {
    0%   { transform: translate(0, 0)        scale(.55); opacity: 0;   }
    18%  {                                               opacity: .85; }
    100% { transform: translate(34px, -56px) scale(1.4); opacity: 0;   }
  }

  .dino-shadow {
    position: absolute;
    left: 68%; bottom: calc(26% - 5px);
    width: 96px; height: 12px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #000; opacity: .3; filter: blur(5px);
  }

  /* --- the work, stacking up ------------------------------------------- */

  .stack {
    position: absolute;
    left: 30%; bottom: 26%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column-reverse;  /* newest on top of the pile */
    align-items: center;
    gap: 5px;
    padding-bottom: 2px;
  }

  .task {
    width: 84px; height: 18px;
    border-radius: 0;
    background: var(--task);
    border: 0; padding: 0;
    cursor: pointer;
    opacity: .82;
    /* Hard offset shadow, no blur — a sprite sitting on a surface, not a card. */
    box-shadow: 3px 3px 0 rgba(0, 0, 0, .55);
    transition: opacity .2s steps(2), box-shadow .2s steps(2);
  }
  .task:hover { opacity: 1; }
  .task[data-selected="true"] {
    opacity: 1;
    box-shadow: 3px 3px 0 rgba(0,0,0,.55), 0 0 0 3px var(--bg), 0 0 0 6px var(--task);
  }
  /* Same rule for the work itself: a hard ring, not a halo. */
  .task[data-attention="true"] {
    opacity: 1;
    box-shadow: 3px 3px 0 rgba(0,0,0,.55), 0 0 0 3px color-mix(in srgb, var(--task) 45%, transparent);
  }
  .task[data-state="done"] { opacity: .45; }

  /* Dropping in, in whole frames rather than a smooth arc. */
  .task[data-dropping="true"] { animation: drop .5s steps(7, jump-none); }
  @keyframes drop {
    0%   { transform: translateY(-260px); opacity: 0;   }
    99%  { transform: translateY(0);      opacity: .82; }
    100% { transform: translateY(0);      opacity: .82; }
  }

  /* Fed to the dino: across the floor and gone. */
  .task[data-feeding="true"] {
    animation: feed .42s steps(6, jump-none) forwards;
  }
  @keyframes feed {
    0%   { transform: translateX(0);                          opacity: 1; }
    99%  { transform: translateX(var(--feed-dx, 150px)) scaleX(.1); opacity: 1; }
    100% { transform: translateX(var(--feed-dx, 150px)) scaleX(.1); opacity: 0; }
  }

  .stack-more {
    font-size: 11px; color: var(--faint);
    margin-top: 3px; font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    .dino, .dino::before, .dino::after, .task { animation: none !important; }
    /* A z frozen mid-drift looks broken, so show one steady one instead. */
    .z { animation: none !important; opacity: .55; }
    .z:nth-child(2), .z:nth-child(3) { display: none; }
  }

  /* --- caption -------------------------------------------------------- */

  .caption { text-align: center; padding: 22px 8px 0; }

  .title-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 10px;
  }
  .swatch { width: 9px; height: 9px; border-radius: 0; background: var(--accent); flex: none; }

  .title {
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    background: none; border: 0; padding: 2px 4px;
    font-family: inherit;
    cursor: text;
    border-radius: 5px;
    max-width: 100%;
  }
  .title:hover { color: var(--muted); background: var(--panel); }

  .title-input {
    font: inherit; font-size: 12px; letter-spacing: .1em;
    text-align: center;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--accent-dark); border-radius: 6px;
    padding: 3px 8px; width: 100%; max-width: 380px;
  }
  .title-input:focus { outline: none; }

  .status {
    font-size: 17px; line-height: 1.45; color: var(--muted);
    margin: 0; text-wrap: pretty;
  }
  .scene-wrap[data-attention="true"] .status { color: var(--text); }

  .ask {
    font-size: 19px; line-height: 1.45; color: var(--text);
    margin: 10px 0 0; text-wrap: pretty;
  }
  .ask[data-echo="true"] { display: none; }

  /* Something queued for this agent — currently only a merge instruction. */
  .note {
    font-size: 13px; line-height: 1.5;
    color: var(--muted);
    margin: 14px auto 0; max-width: 440px;
    padding: 10px 14px;
    border-left: 3px solid #f5b942;
    text-align: left;
    background: var(--panel);
  }

  /* --- answering -------------------------------------------------------- */

  .actions { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .actions[hidden] { display: none; }

  button.act {
    font: inherit; font-size: 14px;
    padding: 9px 18px; border-radius: 0;
    border: 1px solid var(--line);
    background: transparent; color: var(--muted);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  button.act:hover { color: var(--text); border-color: var(--accent-dark); }
  button.act.primary {
    background: var(--accent); border-color: var(--accent);
    color: #06120b; font-weight: 600;
  }
  button.act.primary:hover { filter: brightness(1.12); color: #06120b; }

  .feed {
    display: block; margin: 14px auto 0;
    border: 1px dashed var(--line);
    background: transparent; color: var(--faint);
    font: inherit; font-size: 13px;
    padding: 8px 16px; border-radius: 0; cursor: pointer;
  }
  .feed:hover { color: var(--accent); border-color: var(--accent-dark); }
  .feed[hidden] { display: none; }

  .hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 12px; min-height: 18px; }

  .composer { display: flex; gap: 8px; margin-top: 14px; }
  .composer[hidden] { display: none; }
  .composer input {
    flex: 1; font: inherit; font-size: 14px;
    padding: 10px 14px; border-radius: 0;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  .composer input:focus { outline: none; border-color: var(--accent-dark); }

  /* --- the rest of the tab ------------------------------------------------ */

  .roster { margin-top: 26px; border-top: 1px solid var(--line-soft); }
  .roster[hidden] { display: none; }

  .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 12px 6px;
    border: 0; border-bottom: 1px solid var(--line-soft);
    background: transparent; color: var(--muted);
    font: inherit; font-size: 14px;
    text-align: left; cursor: pointer;
  }
  .row:hover { color: var(--text); }
  .row .pip { width: 10px; height: 10px; border-radius: 0; flex: none; }
  .row .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .when { color: var(--faint); font-size: 12px; flex: none; }
  .row[data-static="true"] { cursor: default; }
  .row[data-static="true"]:hover { color: var(--muted); }

  .empty { text-align: center; color: var(--faint); padding: 48px 20px; font-size: 14px; }

  /* --- trail --------------------------------------------------------------- */

  .trail-toggle {
    display: block; margin: 26px auto 0;
    border: 0; background: transparent; padding: 4px;
    color: var(--faint); font: inherit; font-size: 12px; cursor: pointer;
  }
  .trail-toggle:hover { color: var(--muted); }

  .trail {
    margin: 14px 0 0; padding: 16px 18px; list-style: none;
    border-top: 1px solid var(--line-soft);
    max-height: 240px; overflow-y: auto;
    font-size: 13px; color: var(--faint);
  }
  .trail[hidden] { display: none; }
  .trail li { display: flex; gap: 12px; padding: 3px 0; }
  .trail time { color: #3b463f; font-variant-numeric: tabular-nums; flex: none; }
  .trail li[data-kind="you"] { color: var(--accent-deep); }

  /* --- projects modal -------------------------------------------------------- */

  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(4, 7, 6, .72);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .scrim[hidden] { display: none; }

  .modal {
    width: 100%; max-width: 520px;
    max-height: 80vh; overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 22px;
  }

  .modal header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 6px;
  }
  .modal h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .modal .note { color: var(--faint); font-size: 12px; margin: 0 0 18px; }

  .project { padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .project:first-of-type { border-top: 0; }

  .project-name {
    font: inherit; font-size: 14px;
    width: 100%; padding: 8px 12px;
    border-radius: 0; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .project-name:focus { outline: none; border-color: var(--line); }

  .project-dir {
    display: block; font-size: 11px; color: var(--faint);
    margin: 6px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
  }

  .crowd-note { font-size: 12px; color: var(--faint); margin: 12px 0 0; }
  .crowd-note[data-many="true"] { color: #f5b942; }

  .crowd { margin-top: 4px; }
  .crowd-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0 0;
  }
  .crowd-title {
    flex: 1; font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatch-pick {
    width: 24px; height: 24px; border-radius: 0;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .swatch-pick[aria-pressed="true"] { border-color: var(--text); }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="toolbar-right">
      <span class="link" id="link" data-live="true">reconnecting</span>
      <button class="ghost" id="open-projects">Projects</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="scrim" id="scrim" hidden>
    <div class="modal" role="dialog" aria-label="Projects">
      <header>
        <h2>Projects</h2>
        <button class="ghost" id="close-projects">Done</button>
      </header>
      <p class="note">Name each project and give it a colour. The colour is how you
        recognise past work, so it stays with the project rather than the agent.</p>
      <div id="project-list"></div>
    </div>
  </div>

<script type="module">
  const stage = document.getElementById('stage');
  const tabsEl = document.getElementById('tabs');
  const linkEl = document.getElementById('link');
  const scrim = document.getElementById('scrim');
  const projectListEl = document.getElementById('project-list');

  const RESTING_LINE = {
    idle: 'Nothing running',
    working: 'Working',
    waiting: 'Finished',
    asking: 'It asked you something',
    blocked: 'It needs your go-ahead',
    done: 'Done',
  };

  /**
   * Which tab a session belongs in. Review is the queue that wants you:
   * anything finished or asking, waiting on your call to answer or to feed it
   * to the dino. Active is only work still in flight.
   */
  const REVIEW_STATES = new Set(['waiting', 'asking', 'blocked', 'done']);
  const tabOf = (s) => (REVIEW_STATES.has(s.state) ? 'review' : 'active');

  const TABS = [
    { id: 'active', label: 'Active' },
    { id: 'review', label: 'Review' },
    { id: 'archived', label: 'Archived' },
  ];

  const escapeHtml = (v) => String(v).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const day = (ms) => new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });

  // --- view state ---------------------------------------------------------

  let data = { sessions: [], archived: [], projects: [], palette: [] };
  let tab = 'review';
  /** Explicit pick in the current tab; cleared when it leaves. */
  let focusId = null;
  let composerOpen = false;
  let trailOpen = false;
  let editingTitle = false;
  /** Session mid-gulp, so the animation finishes before the row vanishes. */
  let feedingId = null;
  /** Sessions already on screen, so only genuinely new work drops in. */
  const seen = new Set();
  /** Sessions dropping right now. */
  let dropping = new Set();
  /** A short-lived reaction that outranks the ambient mood. */
  let reactionUntil = 0;

  const post = (route, body) =>
    fetch(route, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });

  const inTab = () => data.sessions.filter((s) => tabOf(s) === tab);
  const focused = () => {
    const rows = inTab();
    return rows.find((s) => s.id === focusId) || rows[0] || null;
  };

  const colorOf = (session) =>
    (data.palette.find((c) => c.id === session?.project?.color) || data.palette[0])?.hex || '#4ade80';

  /** Paint the page in the focused session's project colour. */
  function applyAccent(session) {
    const hex = colorOf(session);
    const root = document.documentElement.style;
    root.setProperty('--accent', hex);
    // Two dimmer steps of the same hue, so working and idle stay legible.
    root.setProperty('--accent-deep', `color-mix(in srgb, ${hex} 62%, #0b0f0d)`);
    root.setProperty('--accent-dark', `color-mix(in srgb, ${hex} 34%, #0b0f0d)`);
  }

  // --- rendering -----------------------------------------------------------

  function renderTabs() {
    const counts = {
      active: data.sessions.filter((s) => tabOf(s) === 'active').length,
      review: data.sessions.filter((s) => tabOf(s) === 'review').length,
      archived: data.archived.length,
    };
    tabsEl.innerHTML = TABS.map(({ id, label }) => `
      <button class="tab" role="tab" data-tab="${id}" aria-selected="${id === tab}">
        ${label}<span class="count" data-any="${counts[id] > 0}">${counts[id]}</span>
      </button>`).join('');
  }

  function trailFor(session) {
    const items = session.events.slice(-60).reverse().map((e) => `
      <li data-kind="${e.kind}"><time>${clock(e.at)}</time><span>${escapeHtml(e.text)}</span></li>`).join('');
    return `
      <button class="trail-toggle">${trailOpen ? '▾' : '▸'} what it did (${session.events.length})</button>
      <ul class="trail" ${trailOpen ? '' : 'hidden'}>${items || '<li>Nothing yet.</li>'}</ul>`;
  }

  /** Work that is asking for you, as opposed to work merely finished. */
  const wantsYou = (s) => s.state === 'waiting' || s.state === 'asking' || s.state === 'blocked';

  /**
   * What the dino is doing, from the work in view. Deliberately aggregate:
   * one creature cannot represent five sessions, but it can tell you at a
   * glance whether any of them needs you.
   */
  function mood(rows) {
    if (Date.now() < reactionUntil) return 'pleased';
    if (rows.some(wantsYou)) return 'alert';
    if (rows.length > 0) return 'watching';
    return 'bored';
  }

  /** Eyes front when something wants you; on the pile when work is happening. */
  function look(rows, currentMood) {
    if (currentMood === 'alert') return 'you';
    if (rows.length > 0) return 'stack';
    return 'away';
  }

  /** How many rectangles fit before the pile would run off the top. */
  const MAX_VISIBLE = 7;

  function sceneFor(rows, session) {
    const currentMood = mood(rows);
    // Oldest at the bottom of the pile: the stack renders column-reverse.
    const shown = rows.slice(0, MAX_VISIBLE).reverse();
    const hidden = rows.length - shown.length;

    return `
      <div class="scene" data-mood="${currentMood}">
        <div class="horizon"></div>

        <div class="stack">
          ${hidden > 0 ? `<span class="stack-more">+${hidden} more</span>` : ''}
          ${shown.map((s) => `
            <button class="task"
                    data-focus="${s.id}"
                    data-state="${s.state}"
                    data-attention="${wantsYou(s)}"
                    data-selected="${session && s.id === session.id}"
                    data-dropping="${dropping.has(s.id)}"
                    data-feeding="${feedingId === s.id}"
                    style="--task:${colorOf(s)}"
                    title="${escapeHtml(s.label)}"></button>`).join('')}
        </div>

        <div class="dino-shadow"></div>
        <div class="dino-anchor">
          <div class="dino" data-mood="${currentMood}" data-look="${look(rows, currentMood)}"></div>
          <div class="zzz" aria-hidden="true"><span class="z">z</span><span class="z">z</span><span class="z">z</span></div>
        </div>
      </div>`;
  }

  function archivedView() {
    if (data.archived.length === 0) {
      return `${sceneFor([], null)}<p class="empty">Nothing fed to the dino yet.</p>`;
    }
    return `
      <div class="roster">
        ${data.archived.map((entry) => `
          <div class="row" data-static="true">
            <span class="pip" style="background:${
              (data.palette.find((c) => c.id === entry.project.color) || {}).hex || '#4ade80'}"></span>
            <span class="who">${escapeHtml(entry.label)}</span>
            <span class="when">${day(entry.archivedAt)}</span>
          </div>`).join('')}
      </div>`;
  }

  function sessionView(rows, session) {
    const attention = wantsYou(session);
    const ask = session.summary?.ask || '';
    const status = session.summary?.headline || session.lastActivity?.text
      || RESTING_LINE[session.state] || '';

    return `
      <div class="scene-wrap" data-attention="${attention}">
        ${sceneFor(rows, session)}

        <div class="caption">
          <div class="title-row">
            <span class="swatch"></span>
            ${editingTitle
              ? `<form class="title-form"><input class="title-input" name="title"
                   value="${escapeHtml(session.title)}" autocomplete="off" /></form>`
              : `<button class="title" title="Click to rename this work">${escapeHtml(session.label)}</button>`}
          </div>

          <p class="status">${escapeHtml(status)}</p>
          ${ask ? `<p class="ask" data-echo="${ask === status}">${escapeHtml(ask)}</p>` : ''}
          ${session.note ? `<p class="note">${escapeHtml(session.note)}</p>` : ''}

          <div class="actions" ${session.waiting ? '' : 'hidden'}>
            <button class="act primary" data-act="go">Keep going</button>
            <button class="act" data-act="stop">All good</button>
            <button class="act" data-act="say">Say something…</button>
          </div>

          <form class="composer" ${composerOpen && session.waiting ? '' : 'hidden'}>
            <input name="reason" placeholder="Tell it what to do next…" autocomplete="off" />
            <button class="act" type="submit">Send</button>
          </form>

          <p class="hint">${session.waiting ? 'or just hit Enter' : ''}</p>

          <button class="feed" data-act="feed"
                  ${tabOf(session) === 'review' ? '' : 'hidden'}>Feed it to the dino</button>
        </div>

        ${trailFor(session)}
      </div>`;
  }

  function emptyView() {
    return `
      ${sceneFor([], null)}
      <p class="empty">${tab === 'active'
        ? 'Nothing running. Start an agent in a terminal and it shows up here.'
        : 'Nothing waiting on you.'}</p>`;
  }

  function render() {
    renderTabs();

    if (tab === 'archived') {
      applyAccent(null);
      stage.innerHTML = archivedView();
      return;
    }

    const rows = inTab();
    const session = focused();
    applyAccent(session);
    stage.innerHTML = session ? sessionView(rows, session) : emptyView();

    if (editingTitle) stage.querySelector('.title-input')?.focus();
    else if (composerOpen) stage.querySelector('.composer input')?.focus();
  }

  /** Live agents working in a given project, newest first. */
  const agentsIn = (projectId) => data.sessions.filter((s) => s.project.id === projectId);

  /**
   * More than one agent in the same project is the case worth surfacing: it is
   * how two of them end up doing the same work without either knowing.
   */
  function crowdFor(project) {
    const agents = agentsIn(project.id);
    if (agents.length < 2) {
      return agents.length === 1
        ? '<p class="crowd-note">1 agent working here.</p>'
        : '';
    }
    return `
      <div class="crowd">
        <p class="crowd-note" data-many="true">${agents.length} agents working here.
          They may be doing the same work — keep one and fold the rest into it.</p>
        ${agents.map((s) => `
          <div class="crowd-row">
            <span class="crowd-title">${escapeHtml(s.title)}</span>
            <button class="ghost" data-merge-keep="${s.id}">Keep this one</button>
          </div>`).join('')}
      </div>`;
  }

  function renderProjects() {
    if (data.projects.length === 0) {
      projectListEl.innerHTML = '<p class="empty">No projects seen yet.</p>';
      return;
    }
    projectListEl.innerHTML = data.projects.map((p) => `
      <div class="project" data-project="${escapeHtml(p.id)}">
        <input class="project-name" value="${escapeHtml(p.name)}" autocomplete="off" />
        <span class="project-dir">${escapeHtml(p.id)}</span>
        <div class="swatches">
          ${data.palette.map((c) => `
            <button class="swatch-pick" data-color="${c.id}"
                    aria-pressed="${c.id === p.color}"
                    style="background:${c.hex}" title="${c.id}"></button>`).join('')}
        </div>
        ${crowdFor(p)}
      </div>`).join('');
  }

  // --- interaction ----------------------------------------------------------

  tabsEl.addEventListener('click', (event) => {
    const next = event.target.closest('[data-tab]')?.dataset.tab;
    if (!next || next === tab) return;
    tab = next;
    focusId = null;
    composerOpen = editingTitle = false;
    render();
  });

  document.getElementById('open-projects').addEventListener('click', () => {
    renderProjects();
    scrim.hidden = false;
  });
  document.getElementById('close-projects').addEventListener('click', () => { scrim.hidden = true; });
  scrim.addEventListener('click', (e) => { if (e.target === scrim) scrim.hidden = true; });

  projectListEl.addEventListener('click', async (event) => {
    const keep = event.target.closest('[data-merge-keep]');
    if (keep) {
      const projectId = keep.closest('[data-project]').dataset.project;
      const keepId = keep.dataset.mergeKeep;
      const absorb = agentsIn(projectId).map((s) => s.id).filter((id) => id !== keepId);
      await post('/api/merge', { keep_id: keepId, absorb_ids: absorb });
      // Show the survivor, so the note it just picked up is in front of you.
      tab = tabOf(data.sessions.find((s) => s.id === keepId) || { state: 'working' });
      focusId = keepId;
      scrim.hidden = true;
      return render();
    }

    const pick = event.target.closest('[data-color]');
    if (!pick) return;
    const id = pick.closest('[data-project]').dataset.project;
    post('/api/project', { id, color: pick.dataset.color });
  });

  projectListEl.addEventListener('change', (event) => {
    const field = event.target.closest('.project-name');
    if (!field) return;
    post('/api/project', { id: field.closest('[data-project]').dataset.project, name: field.value });
  });

  stage.addEventListener('click', (event) => {
    const jump = event.target.closest('[data-focus]');
    if (jump) {
      focusId = jump.dataset.focus;
      composerOpen = editingTitle = false;
      return render();
    }

    if (event.target.closest('.trail-toggle')) {
      trailOpen = !trailOpen;
      return render();
    }

    if (event.target.closest('.title')) {
      editingTitle = true;
      return render();
    }

    const session = focused();
    const act = event.target.closest('[data-act]')?.dataset.act;
    if (!session || !act) return;

    // A merge note is the whole reason the agent is being kept, so it goes as
    // the instruction rather than a bare "keep going".
    if (act === 'go') decide(session.id, 'go', session.note || 'Keep going.');
    if (act === 'stop') decide(session.id, 'stop');
    if (act === 'say') { composerOpen = true; render(); }
    if (act === 'feed') feed(session.id);
  });

  stage.addEventListener('submit', (event) => {
    event.preventDefault();
    const session = focused();
    if (!session) return;

    if (event.target.classList.contains('title-form')) {
      editingTitle = false;
      return void post('/api/title', { session_id: session.id, title: event.target.title.value });
    }

    const text = event.target.reason.value.trim();
    if (text) decide(session.id, 'go', text);
  });

  /** A brief pleased bob, so a decision visibly lands rather than just happening. */
  function react() {
    reactionUntil = Date.now() + 900;
    setTimeout(render, 950);
  }

  async function decide(sessionId, action, reason) {
    composerOpen = false;
    react();
    await post('/api/decide', { session_id: sessionId, action, reason });
  }

  /**
   * Send the rectangle across the floor into the dino, then archive it.
   *
   * The distance is measured rather than hard-coded: the stack and the dino
   * are both positioned as percentages of the scene, so on a narrower window
   * a fixed offset would land the task short of the dino or past it.
   */
  function feed(sessionId) {
    const task = stage.querySelector(`.task[data-focus="${sessionId}"]`);
    const dino = stage.querySelector('.dino');

    if (task && dino) {
      const from = task.getBoundingClientRect();
      const to = dino.getBoundingClientRect();
      const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
      task.style.setProperty('--feed-dx', `${Math.round(dx)}px`);
      task.dataset.feeding = 'true';
    }

    feedingId = sessionId;
    setTimeout(() => {
      feedingId = null;
      react();
      post('/api/archive', { session_id: sessionId });
    }, 460);
  }

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (!scrim.hidden) return void (scrim.hidden = true);
      if (editingTitle || composerOpen) { editingTitle = composerOpen = false; return render(); }
    }
    if (event.key !== 'Enter' || event.target.tagName === 'INPUT') return;
    const session = focused();
    if (session?.waiting) decide(session.id, 'go', session.note || 'Keep going.');
  });

  // --- live state -------------------------------------------------------------

  function adopt(next) {
    const first = data.sessions.length === 0 && seen.size === 0;
    data = next;

    // Only genuinely new work drops in. Without this, every state update would
    // re-run the animation and the pile would twitch constantly.
    const arrivals = data.sessions.filter((s) => !seen.has(s.id));
    for (const s of data.sessions) seen.add(s.id);

    // The very first payload after connecting is the existing world, not new
    // arrivals — dropping all of it at once would be a lie about what happened.
    if (!first && arrivals.length > 0) {
      dropping = new Set(arrivals.map((s) => s.id));
      setTimeout(() => {
        dropping = new Set();
        render();
      }, 640);
    }

    // A focus you set is only meaningful while that session is still in view.
    if (focusId && !inTab().some((s) => s.id === focusId)) focusId = null;

    const session = focused();
    if (!session?.waiting) composerOpen = false;

    render();
    if (!scrim.hidden) renderProjects();
  }

  function connect() {
    const stream = new EventSource('/api/stream');
    stream.onopen = () => { linkEl.dataset.live = 'true'; };
    stream.onmessage = (event) => adopt(JSON.parse(event.data));
    stream.onerror = () => {
      linkEl.dataset.live = 'false';
      stream.close();
      setTimeout(connect, 2000);
    };
  }

  render();
  connect();
</script>
</body>
</html>
