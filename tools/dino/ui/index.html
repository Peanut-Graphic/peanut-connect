<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dino</title>
<style>
  /* ---------------------------------------------------------------
     This is a thing to look at, not a thing to operate.

     So: the creature is the whole picture and the words are a caption.
     Nothing moves quickly, nothing flashes, nothing changes position
     when the state changes — a layout that jumps is a layout you have
     to keep re-reading. What changes is colour and posture, which the
     corner of your eye can read without you turning your head.
     --------------------------------------------------------------- */
  :root {
    --bg: #0b0f0d;
    --sky-top: #121a16;
    --sky-bottom: #0b0f0d;
    --line: #1f2a24;
    --text: #dfe9e3;
    --muted: #7c8b83;
    --faint: #4a574f;
    --green: #4ade80;
    --green-deep: #2f7a4d;
    --green-dark: #24503a;
    --amber: #f5b942;
  }

  * { box-sizing: border-box; }

  /* 100vh, not 100%: a percentage min-height on body resolves against html's
     auto height and collapses to nothing, which leaves the stage stuck at the
     top instead of centred. */
  html { min-height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  .stage { width: 100%; max-width: 520px; margin: auto 0; }

  /* --- the scene ---------------------------------------------------
     A lit box with a floor. The creature lives here. Everything else
     on the page is subordinate to it.
     ------------------------------------------------------------------ */

  .scene {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 22px;
    border: 1px solid var(--line);
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, var(--sky-top) 0%, var(--sky-bottom) 70%);
    transition: border-color 1.2s ease, background 1.2s ease;
  }

  /* When it wants you, the room warms up. This is the signal — not a
     badge, not a flash. Visible from across the desk, ignorable up close. */
  .scene[data-attention="true"] {
    border-color: var(--green-deep);
    background:
      radial-gradient(120% 80% at 50% 0%, #16261d 0%, var(--sky-bottom) 72%);
  }
  .scene[data-attention="true"][data-blocked="true"] {
    border-color: #6b5320;
    background:
      radial-gradient(120% 80% at 50% 0%, #241d10 0%, var(--sky-bottom) 72%);
  }

  /* The floor the creature stands on. Barely there, but without it the
     creature is floating in a void and reads as a logo, not an animal. */
  .horizon {
    position: absolute;
    left: 12%; right: 12%;
    bottom: 27%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 25%, var(--line) 75%, transparent);
  }

  .shadow {
    position: absolute;
    left: 50%; bottom: calc(27% - 6px);
    width: 112px; height: 14px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #000;
    opacity: .35;
    filter: blur(5px);
    transition: opacity 1s ease;
  }

  .anchor {
    position: absolute;
    left: 50%; bottom: 27%;
    transform: translateX(-50%);
  }

  /* --- the dinosaur, currently a box --------------------------------

     SWAP POINT. Replace `.creature` with the sprite when there is one.
     Every posture below hangs off the single `data-state` attribute, so
     a sprite that honours those six values inherits all of this for free.
     ------------------------------------------------------------------ */

  .creature {
    width: 132px; height: 132px;
    border-radius: 32px;
    background: var(--green-dark);
    position: relative;
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }

  .creature::before,
  .creature::after {
    content: "";
    position: absolute;
    top: 52px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #080c0a;
    transition: height .14s ease, top .14s ease, opacity 1s ease;
  }
  .creature::before { left: 34px; }
  .creature::after  { right: 34px; }

  /* Eyes closed: a sleeping box is two short lines, not two dots. */
  .creature[data-state="idle"]::before,
  .creature[data-state="idle"]::after,
  .creature[data-state="done"]::before,
  .creature[data-state="done"]::after {
    height: 3px;
    top: 58px;
    border-radius: 2px;
  }

  /* Nothing running — dozing, and pleasant to have on screen. */
  .creature[data-state="idle"] {
    background: var(--green-dark);
    opacity: .5;
    animation: doze 6s ease-in-out infinite;
  }
  @keyframes doze {
    0%, 100% { transform: translateY(0)    scaleY(1);    }
    50%      { transform: translateY(1px)  scaleY(.985); }
  }

  /* Busy — a slow breath. This is what "still going" looks like when you
     glance over, and it is the reason there is no spinner anywhere. */
  .creature[data-state="working"] {
    background: var(--green-deep);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0)    scale(1);     }
    50%      { transform: translateY(-6px) scale(1.025); }
  }
  .scene[data-state="working"] .shadow { animation: shadow-breathe 3.4s ease-in-out infinite; }
  @keyframes shadow-breathe {
    0%, 100% { opacity: .35; transform: translateX(-50%) scaleX(1);   }
    50%      { opacity: .22; transform: translateX(-50%) scaleX(.88); }
  }

  /* Your turn — awake, upright, faintly lit. It holds still on purpose:
     something that jiggles at you is something you end up resenting. */
  .creature[data-state="waiting"],
  .creature[data-state="asking"] {
    background: var(--green);
    transform: translateY(-4px);
    box-shadow: 0 0 44px -6px rgba(74, 222, 128, .38);
    animation: alert 4.5s ease-in-out infinite;
  }
  .creature[data-state="blocked"] {
    background: var(--amber);
    transform: translateY(-4px);
    box-shadow: 0 0 44px -6px rgba(245, 185, 66, .34);
    animation: alert 4.5s ease-in-out infinite;
  }
  @keyframes alert {
    0%, 100% { box-shadow: 0 0 40px -8px rgba(74, 222, 128, .30); }
    50%      { box-shadow: 0 0 52px -4px rgba(74, 222, 128, .46); }
  }

  /* Finished and content. */
  .creature[data-state="done"] {
    background: var(--green-deep);
    opacity: .68;
  }

  @media (prefers-reduced-motion: reduce) {
    .creature, .shadow { animation: none !important; }
  }

  /* --- the caption ---------------------------------------------------
     Small, centred, quiet. If you have to read this to know how things
     are going, the creature above it has failed at its job.
     ------------------------------------------------------------------ */

  .caption { text-align: center; padding: 22px 8px 0; }

  .project {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 10px;
  }

  .status {
    font-size: 17px;
    line-height: 1.45;
    color: var(--muted);
    margin: 0;
    text-wrap: pretty;
    transition: color 1s ease;
  }
  .scene-wrap[data-attention="true"] .status { color: var(--text); }

  /* The question it asked. The only thing on the page allowed to be loud. */
  .ask {
    font-size: 19px;
    line-height: 1.45;
    color: var(--text);
    margin: 10px 0 0;
    text-wrap: pretty;
  }
  .ask[data-echo="true"] { display: none; }

  /* --- answering -------------------------------------------------------
     Absent until there is something to answer. A row of dead buttons is
     furniture, and furniture is what makes a window feel like a console.
     ---------------------------------------------------------------------- */

  .actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .actions[hidden] { display: none; }

  button {
    font: inherit;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  button:hover { color: var(--text); border-color: var(--green-dark); }
  button.primary {
    background: var(--green);
    border-color: var(--green);
    color: #06120b;
    font-weight: 600;
  }
  button.primary:hover { background: #6ae899; border-color: #6ae899; color: #06120b; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--faint);
    margin-top: 12px;
    min-height: 18px;
  }

  .composer { display: flex; gap: 8px; margin-top: 14px; }
  .composer[hidden] { display: none; }
  .composer input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #0e1411;
    color: var(--text);
  }
  .composer input::placeholder { color: var(--faint); }
  .composer input:focus { outline: none; border-color: var(--green-dark); }

  /* --- the other agents -------------------------------------------------
     Only appears when there is more than one. A single terminal is the
     common case and should not pay for the crowded one.
     ---------------------------------------------------------------------- */

  .others { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .others[hidden] { display: none; }

  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--faint);
    font-size: 12px;
    cursor: pointer;
  }
  .chip:hover { color: var(--muted); }
  .chip[data-current="true"] { border-color: var(--line); color: var(--muted); }
  .chip .pip {
    width: 10px; height: 10px;
    border-radius: 3px;
    background: var(--green-dark);
    flex: none;
  }
  .chip[data-state="working"] .pip { background: var(--green-deep); }
  .chip[data-state="waiting"] .pip,
  .chip[data-state="asking"]  .pip { background: var(--green); }
  .chip[data-state="blocked"] .pip { background: var(--amber); }

  /* --- what it did ------------------------------------------------------
     Tucked right down. It is for the moment you decide to dive in, which
     is not most moments.
     ---------------------------------------------------------------------- */

  .trail-toggle {
    display: block;
    margin: 28px auto 0;
    border: 0;
    padding: 4px;
    color: var(--faint);
    font-size: 12px;
  }
  .trail-toggle:hover { color: var(--muted); border-color: transparent; }

  .trail {
    margin: 14px 0 0;
    padding: 16px 18px;
    list-style: none;
    border-top: 1px solid var(--line);
    max-height: 240px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--faint);
  }
  .trail[hidden] { display: none; }
  .trail li { display: flex; gap: 12px; padding: 3px 0; }
  .trail time { color: #3b463f; font-variant-numeric: tabular-nums; flex: none; }
  .trail li[data-kind="you"] { color: var(--green-deep); }

  /* --- link state --------------------------------------------------------- */

  .link {
    position: fixed;
    top: 16px; right: 18px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: transparent;
    transition: color .4s ease;
  }
  /* Only worth saying when it is not true. */
  .link[data-live="false"] { color: var(--amber); }
</style>
</head>
<body>
  <span class="link" id="link" data-live="true">reconnecting</span>

  <div class="stage" id="stage"></div>

<script type="module">
  const stage = document.getElementById('stage');
  const linkEl = document.getElementById('link');

  /**
   * The caption under the creature. Short by design — the picture is doing
   * the work, this is only confirming what it already told you.
   */
  const RESTING_LINE = {
    idle: 'Nothing running',
    working: 'Working',
    waiting: 'Finished',
    asking: 'It asked you something',
    blocked: 'It needs your go-ahead',
    done: 'Done',
  };

  const ATTENTION = new Set(['waiting', 'asking', 'blocked']);

  const clock = (ms) =>
    new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  // --- what the user is currently looking at ----------------------------

  let sessions = [];
  /** Explicit pick via a chip. Cleared once that session stops needing you. */
  let pinnedId = null;
  let composerOpen = false;
  let trailOpen = false;

  function current() {
    return sessions.find((s) => s.id === pinnedId) || sessions[0] || null;
  }

  async function decide(sessionId, action, reason) {
    composerOpen = false;
    await fetch('/api/decide', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, action, reason }),
    });
  }

  // --- rendering ---------------------------------------------------------

  function emptyStage() {
    return `
      <div class="scene-wrap" data-attention="false">
        <div class="scene" data-state="idle" data-attention="false">
          <div class="horizon"></div>
          <div class="shadow"></div>
          <div class="anchor"><div class="creature" data-state="idle"></div></div>
        </div>
        <div class="caption">
          <p class="status">Nothing running</p>
          <p class="hint">Start an agent in a terminal and it shows up here.</p>
        </div>
      </div>`;
  }

  function view(session) {
    const attention = ATTENTION.has(session.state);
    const ask = session.summary?.ask || '';
    const status = session.summary?.headline
      || session.lastActivity?.text
      || RESTING_LINE[session.state]
      || '';

    const others = sessions.length > 1 ? `
      <div class="others">
        ${sessions.map((s) => `
          <button class="chip" data-chip="${s.id}" data-state="${s.state}"
                  data-current="${s.id === session.id}">
            <span class="pip"></span>${escapeHtml(s.label)}
          </button>`).join('')}
      </div>` : '';

    const trail = `
      <button class="trail-toggle">${trailOpen ? '▾' : '▸'} what it did (${session.events.length})</button>
      <ul class="trail" ${trailOpen ? '' : 'hidden'}>
        ${session.events.slice(-60).reverse().map((e) => `
          <li data-kind="${e.kind}"><time>${clock(e.at)}</time><span>${escapeHtml(e.text)}</span></li>`,
        ).join('') || '<li>Nothing yet.</li>'}
      </ul>`;

    return `
      <div class="scene-wrap" data-attention="${attention}">
        <div class="scene" data-state="${session.state}"
             data-attention="${attention}"
             data-blocked="${session.state === 'blocked'}">
          <div class="horizon"></div>
          <div class="shadow"></div>
          <div class="anchor"><div class="creature" data-state="${session.state}"></div></div>
        </div>

        <div class="caption">
          <div class="project">${escapeHtml(session.label)}</div>
          <p class="status">${escapeHtml(status)}</p>
          ${ask ? `<p class="ask" data-echo="${ask === status}">${escapeHtml(ask)}</p>` : ''}

          <div class="actions" ${session.waiting ? '' : 'hidden'}>
            <button class="primary" data-act="go">Keep going</button>
            <button data-act="stop">All good</button>
            <button data-act="say">Say something…</button>
          </div>

          <form class="composer" ${composerOpen && session.waiting ? '' : 'hidden'}>
            <input name="reason" placeholder="Tell it what to do next…" autocomplete="off" />
            <button type="submit">Send</button>
          </form>

          <p class="hint">${session.waiting ? 'or just hit Enter' : ''}</p>
        </div>

        ${others}
        ${trail}
      </div>`;
  }

  function render() {
    const session = current();
    stage.innerHTML = session ? view(session) : emptyStage();
    if (composerOpen) stage.querySelector('.composer input')?.focus();
  }

  // --- interaction --------------------------------------------------------

  stage.addEventListener('click', (event) => {
    const session = current();
    if (!session) return;

    const chip = event.target.closest('[data-chip]');
    if (chip) {
      pinnedId = chip.dataset.chip;
      composerOpen = false;
      return render();
    }

    if (event.target.closest('.trail-toggle')) {
      trailOpen = !trailOpen;
      return render();
    }

    const act = event.target.closest('button[data-act]')?.dataset.act;
    if (act === 'go') decide(session.id, 'go', 'Keep going.');
    if (act === 'stop') decide(session.id, 'stop');
    if (act === 'say') { composerOpen = true; render(); }
  });

  stage.addEventListener('submit', (event) => {
    event.preventDefault();
    const session = current();
    const text = event.target.reason.value.trim();
    if (session && text) decide(session.id, 'go', text);
  });

  // The reason this window exists: answering should cost one keystroke.
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && composerOpen) {
      composerOpen = false;
      return render();
    }
    if (event.key !== 'Enter' || event.target.tagName === 'INPUT') return;
    const session = current();
    if (session?.waiting) decide(session.id, 'go', 'Keep going.');
  });

  // --- live state ----------------------------------------------------------

  function adopt(next) {
    sessions = next;

    // Anything that needs you wins the stage, unless you deliberately
    // pinned something else and that pin is still meaningful.
    const pinned = sessions.find((s) => s.id === pinnedId);
    if (!pinned || !ATTENTION.has(pinned.state)) pinnedId = null;

    if (!sessions.some((s) => s.id === (pinnedId ?? sessions[0]?.id) && s.waiting)) {
      composerOpen = false;
    }
    render();
  }

  function connect() {
    const stream = new EventSource('/api/stream');

    stream.onopen = () => { linkEl.dataset.live = 'true'; };
    stream.onmessage = (event) => adopt(JSON.parse(event.data).sessions);

    stream.onerror = () => {
      linkEl.dataset.live = 'false';
      stream.close();
      // EventSource retries on its own, but not after an explicit close —
      // and closing is what stops a dead socket from spinning.
      setTimeout(connect, 2000);
    };
  }

  render();
  connect();
</script>
</body>
</html>
