name: Install checksum-locked gitleaks
description: Install the reviewed gitleaks binary without a moving release lookup

runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

        curl --fail --location --silent --show-error --output "$archive" "$url"
        printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict

        mkdir -p "$install_dir"
        tar -xzf "$archive" -C "$install_dir" gitleaks
        actual_version="$("$install_dir/gitleaks" version)"
        test "$actual_version" = "$GITLEAKS_VERSION"
        echo "$install_dir" >> "$GITHUB_PATH"
