name: Accessibility

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    name: Accessibility Tests
    # ubuntu-latest, matching tests.yml + wp-contract.yml. This job is pure Node
    # (npm ci + eslint + vitest) and needs no special hardware; it had been left
    # pointed at the self-hosted peanut-ci pool, which never serviced it (runs
    # sat queued indefinitely while the rest of CI moved to GitHub-hosted).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint with jsx-a11y
        continue-on-error: true
        run: npm run lint:a11y

      - name: Run accessibility tests
        run: npx vitest run --reporter=verbose -- a11y
