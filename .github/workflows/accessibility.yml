name: Accessibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    name: Accessibility Tests
    # ubuntu-latest, matching tests.yml + wp-contract.yml. This job is pure Node
    # (npm ci + eslint + vitest) and needs no special hardware; it had been left
    # pointed at the self-hosted peanut-ci pool, which never serviced it (runs
    # sat queued indefinitely while the rest of CI moved to GitHub-hosted).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node/npm contract
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify

      - name: Install dependencies
        # legacy-peer-deps: eslint 10 vs eslint-plugin-jsx-a11y peer range
        # (pre-existing; same handling as tests.yml frontend-tests).
        run: npm ci --legacy-peer-deps

      - name: ESLint with jsx-a11y
        continue-on-error: true
        run: npm run lint:a11y

      - name: Run accessibility tests
        run: npx vitest run --reporter=verbose -- a11y
