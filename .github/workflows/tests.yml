# Peanut Ecosystem — Peanut Connect test + security gate.
# Derived from DOCUMENTATION/testing-standard/ci-templates/php-plugin-tests.yml
# and vitest-tests.yml. PHP unit+property tests run without a WordPress boot
# (Brain-Monkey-style mocks in tests/mocks/). Frontend runs vitest.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php
      - name: Dependency audit (PHP)
        run: composer audit --locked || true   # Net 2: start non-blocking; ratchet to blocking
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

  php-tests:
    runs-on: ubuntu-latest
    needs: static-and-security
    env:
      # Coverage is near-zero today: the mock-backed Unit suite only exercises a
      # couple of includes/ classes, and the large tests/phpunit/unit/ suite is
      # dormant (needs WP fn mocks the bootstrap lacks — see known-gaps).
      # Floor is honest (0) and non-regressing; ratchet up once that suite boots.
      MIN_COVERAGE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (with pcov for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit + Property tests + coverage
        run: vendor/bin/phpunit --testsuite=Unit,Property --coverage-clover=coverage/clover.xml

      - name: Coverage gate
        run: php coverage-gate.php coverage/clover.xml "$MIN_COVERAGE"

      - name: Property suite (Net 6, explicit)
        run: vendor/bin/phpunit --testsuite=Property

      - name: Contract suite (Net 7, non-blocking until WP harness wired)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=Contract

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/

  php-minimum-tests:
    runs-on: ubuntu-latest
    needs: static-and-security
    steps:
      - uses: actions/checkout@v4

      - name: Setup declared minimum PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none
          tools: composer

      - name: Install dependencies from the lockfile
        run: composer install --no-interaction --prefer-dist

      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php --expect-runtime=8.0

      - name: Unit + Property tests at the declared minimum
        run: vendor/bin/phpunit --testsuite=Unit,Property

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node/npm contract
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify
      - name: Install dependencies
        # legacy-peer-deps: eslint 10 vs eslint-plugin-jsx-a11y peer range
        # (pre-existing; tracked in known-gaps).
        run: npm ci --legacy-peer-deps
      - name: Dependency audit (frontend)
        run: npm audit --audit-level=high || true   # Net 2: non-blocking to start
      - name: Vitest (incl. Net 6 property tests)
        run: npx vitest run

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Could this be released AT ALL? Read-only: no signing key, no network,
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh peanut-connect
