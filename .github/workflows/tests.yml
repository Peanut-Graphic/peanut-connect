# Peanut Ecosystem — Peanut Connect test + security gate.
# Derived from DOCUMENTATION/testing-standard/ci-templates/php-plugin-tests.yml
# and vitest-tests.yml. PHP unit+property tests run without a WordPress boot
# (Brain-Monkey-style mocks in tests/mocks/). Frontend runs vitest.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Dependency audit (PHP)
        run: composer audit || true   # Net 2: start non-blocking; ratchet to blocking
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

  php-tests:
    runs-on: ubuntu-latest
    needs: static-and-security
    env:
      # Coverage is near-zero today: the mock-backed Unit suite only exercises a
      # couple of includes/ classes, and the large tests/phpunit/unit/ suite is
      # dormant (needs WP fn mocks the bootstrap lacks — see known-gaps).
      # Floor is honest (0) and non-regressing; ratchet up once that suite boots.
      MIN_COVERAGE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (with pcov for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit + Property tests + coverage
        run: vendor/bin/phpunit --testsuite=Unit,Property --coverage-clover=coverage/clover.xml

      - name: Coverage gate
        run: php coverage-gate.php coverage/clover.xml "$MIN_COVERAGE"

      - name: Property suite (Net 6, explicit)
        run: vendor/bin/phpunit --testsuite=Property

      - name: Contract suite (Net 7, non-blocking until WP harness wired)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=Contract

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        # legacy-peer-deps: eslint 10 vs eslint-plugin-jsx-a11y peer range
        # (pre-existing; tracked in known-gaps).
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Dependency audit (frontend)
        run: npm audit --audit-level=high || true   # Net 2: non-blocking to start
      - name: Vitest (incl. Net 6 property tests)
        run: npx vitest run
