# Peanut — WordPress REST contract tests (net 7) on a REAL WordPress.
# Boots a real WP against a MySQL service and runs the real-WP contract suite
# (tests/ContractWp via phpunit.contract-wp.xml) — separate from the mock-based
# unit suites (tests/) so it can never silently fall back to mocks.
#
# Prereqs in the plugin (see .peanut/wp-harness / docs wp-harness/README.md):
#   - wp-phpunit/wp-phpunit + yoast/phpunit-polyfills in require-dev
#   - tests/ContractWp/bootstrap.php defines PLUGIN_MAIN_FILE then requires the shared bootstrap-wp.php
#   - phpunit.contract-wp.xml points at tests/ContractWp with that bootstrap
name: wp-contract

on:
  push: { branches: [ main ] }
  pull_request:

jobs:
  wp-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer
      - run: composer install --no-interaction --prefer-dist

      - name: Fetch shared WP test installer
        run: |
          curl -fsSL -o /tmp/install-wp-tests.sh \
            "https://raw.githubusercontent.com/Peanut-Graphic/peanut-documentation/main/testing-standard/wp-harness/install-wp-tests.sh" \
          || cp .peanut/wp-harness/install-wp-tests.sh /tmp/install-wp-tests.sh   # vendored fallback (private repo)
          chmod +x /tmp/install-wp-tests.sh
          # Regression test for the harness itself (GAP-03): proven to fail on the
          # unfixed installer, which silently paired trunk's test library with
          # pinned core. Runs offline; curl is stubbed.
          bash .peanut/wp-harness/tests/install-wp-tests.test.sh

      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: REST contract tests (net 7, real WordPress)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: vendor/bin/phpunit -c phpunit.contract-wp.xml

  # Additive rather than a matrix conversion: branch protection requires the
  # existing exact `wp-contract` context. This second job proves the verified
  # central-host database family without renaming or weakening that gate.
  #
  # PHP stays on this plugin's own 8.3 contract lane rather than the canary's
  # 8.4 — the variable under test here is the database engine, and changing two
  # at once would make a failure ambiguous.
  wp-contract-mariadb:
    name: wp-contract-mariadb
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer
      - run: composer install --no-interaction --prefer-dist

      - name: Fetch shared WP test installer
        run: |
          curl -fsSL -o /tmp/install-wp-tests.sh \
            "https://raw.githubusercontent.com/Peanut-Graphic/peanut-documentation/main/testing-standard/wp-harness/install-wp-tests.sh" \
          || cp .peanut/wp-harness/install-wp-tests.sh /tmp/install-wp-tests.sh
          chmod +x /tmp/install-wp-tests.sh
          # Regression test for the harness itself (GAP-03): proven to fail on the
          # unfixed installer, which silently paired trunk's test library with
          # pinned core. Runs offline; curl is stubbed.
          bash .peanut/wp-harness/tests/install-wp-tests.test.sh

      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: REST contract tests (net 7, real WordPress on MariaDB 10.6)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: vendor/bin/phpunit -c phpunit.contract-wp.xml
